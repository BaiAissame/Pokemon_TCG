    <!-- Modal for card details -->
    <div id="cardModal" class="modal">
        <div class="modal-content" style="display: flex;flex-direction: column;align-items: center;">
            <button class="close-btn" onclick="app.closeModal()">&times;</button>
            <!-- <h2 style="text-align: center;">Détails de la Carte</h2> -->
            <div class="card-detail" id="cardDetail"></div>
        </div>
    </div>

    <!-- Modal for trainer interaction -->
    <div id="trainerModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="app.closeTrainerModal()">&times;</button>
            <h2 id="trainerModalTitle">Interaction avec le Dresseur</h2>
            <div class="comment-section">
                <h4>Laisser un commentaire:</h4>
                <textarea class="comment-input" id="commentInput"
                    placeholder="Votre commentaire sur ce dresseur..."></textarea>
                <h4>Note:</h4>
                <div class="rating" id="rating">
                    <span class="star" data-rating="1">⭐</span>
                    <span class="star" data-rating="2">⭐</span>
                    <span class="star" data-rating="3">⭐</span>
                    <span class="star" data-rating="4">⭐</span>
                    <span class="star" data-rating="5">⭐</span>
                </div>
                <button class="btn" onclick="app.submitTrainerFeedback()">💾 Envoyer</button>
            </div>
        </div>
    </div>

    <!-- Scripts MVC -->

    <script src="https://cdn.jsdelivr.net/npm/@tcgdex/sdk@2/dist/tcgdex.browser.js"></script>
    <script type="module">
        import GameController from './controllers/GameController.js';
        // Instancier le SDK
        const tcgdex = new TCGdex('fr');


        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', () => {
            const app = new GameController(tcgdex);
            window.app = app;

        });
