    <link rel="stylesheet" type="text/css" href="styles.css">
    <script type="module">
        import GameController from './controllers/GameController.js';

        <nav class="main-nav">

    <main>

        <div class="main-container game-main">

                <div class="deck">

    <script type="module">
        import GameController from './controllers/GameController.js';
