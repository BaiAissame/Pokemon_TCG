<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon TCG - Ma Collection</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <div class="header">
        <div class="logo">⚡ Pokemon TCG Pro ⚡</div>
        <div class="player-info">
            <div class="trainer-name">Dresseur: <span id="trainerName">Ash Ketchup</span></div>
            <div>💰 Crédits: <span id="credits">100</span></div>
        </div>
    </div>

    <nav class="main-nav">
        <a href="index.html" class="nav-link">🏠 Accueil</a>
        <a href="battle.html" class="nav-link">⚔️ Combat</a>
        <a href="collection.html" class="nav-link active">📚 Collection</a>
    </nav>

    <div class="collection-container">
        <div id="collectionContainer">
            <!-- Le contenu de la collection sera généré ici -->
            <div class="loading-collection">
                <div class="spinner"></div>
                <p>Chargement de votre collection...</p>
            </div>
        </div>
    </div>

    <!-- Modal pour les détails des cartes -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="window.collectionApp.closeModal()">&times;</button>
            <div class="card-detail" id="cardDetail"></div>
        </div>
    </div>

    <!-- Modal pour les statistiques -->
    <div id="statsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="this.closest('.modal').style.display='none'">&times;</button>
            <h2>📊 Statistiques de Collection</h2>
            <div id="statsContent"></div>
        </div>
    </div>



    <!-- Scripts -->
    <script type="module" src="models/CardModel.js"></script>
    <script type="module" src="models/TrainerModel.js"></script>
    <script type="module" src="models/GameStateModel.js"></script>
    <script type="module" src="controllers/CollectionController.js"></script>
    <script type="module" src="views/CollectionView.js"></script>
    <script type="module" src="service/SoundService.js"></script>

    <script type="module">
        import GameStateModel from './models/GameStateModel.js';
        import CollectionController from './controllers/CollectionController.js';
        import CollectionView from './views/CollectionView.js';
        import SoundService from './service/SoundService.js';

        class CollectionApp {
            constructor() {
                this.gameState = new GameStateModel();
                this.controller = new CollectionController(this.gameState);
                this.view = new CollectionView();
                this.soundService = new SoundService();

                this.view.setController(this.controller);
                this.controller.setView(this.view);

                this.init();
            }

            async init() {
                this.gameState.load();
                this.updatePlayerInfo();
                this.refreshCollection();
                this.attachGlobalEventListeners();
            }

            updatePlayerInfo() {
                document.getElementById('trainerName').textContent = 'Ash Ketchup';
                document.getElementById('credits').textContent = this.gameState.credits || 100;
            }

            // MÉTHODE MISE À JOUR ICI 👇
            refreshCollection() {
                const cards = this.controller.searchCards();
                const stats = this.controller.getCollectionStats();
                const currentDeck = this.controller.getCurrentDeck(); // Nouveau
                const filters = this.controller.currentFilters;
                filters.searchQuery = this.controller.currentSearchQuery;

                this.view.renderCollection(cards, stats, filters, currentDeck);
            }

            attachGlobalEventListeners() {
                this.controller.onViewUpdate = () => this.refreshCollection();
                this.controller.onCardAdded = (card) => {
                    this.view.showMessage(`Carte "${card.name}" ajoutée au deck!`, 'success');
                    this.soundService.playSound('cardPlay');
                };
                this.controller.onCardRemoved = (card) => {
                    this.view.showMessage(`Carte "${card.name}" supprimée de la collection`, 'info');
                };
                this.controller.onFavoriteToggled = (card, favorited) => {
                    const message = favorited ?
                        `"${card.name}" ajoutée aux favoris ❤️` :
                        `"${card.name}" retirée des favoris 💔`;
                    this.view.showMessage(message, 'info');
                };

                document.addEventListener('click', (e) => {
                    if (e.target.id === 'deckBuilderBtn') {
                        this.openDeckBuilder();
                    } else if (e.target.id === 'collectionStatsBtn') {
                        this.showDetailedStats();
                    } else if (e.target.id === 'addTestCardsBtn') {
                        this.addTestCards();
                    }
                });
            }

            openDeckBuilder() {
                const modal = document.getElementById('deckBuilderModal');
                modal.style.display = 'block';
                this.loadDeckBuilder();
            }

            loadDeckBuilder() {
                const currentDeck = document.getElementById('currentDeck');
                const deckBuilderCards = document.getElementById('deckBuilderCards');

                // Utiliser getCurrentDeck() au lieu d'accéder directement à gameState.deck
                const deckCards = this.controller.getCurrentDeck();
                currentDeck.innerHTML = deckCards.map(card => `
                    <div class="deck-card-item">
                        <img src="${card.image}" alt="${card.name}" class="deck-card-thumb">
                        <span class="deck-card-name">${card.name}</span>
                        <button class="btn-icon remove-from-deck" data-card-id="${card.id}">❌</button>
                    </div>
                `).join('');

                const availableCards = this.controller.searchCards();
                deckBuilderCards.innerHTML = availableCards.map(card => `
                    <div class="deck-builder-card" data-card-id="${card.id}">
                        <img src="${card.image}" alt="${card.name}" class="builder-card-image">
                        <div class="builder-card-info">
                            <div class="builder-card-name">${card.name}</div>
                            <div class="builder-card-type">${card.types?.[0]?.name || 'Unknown'}</div>
                        </div>
                        <button class="btn btn-small btn-primary add-to-deck-builder" data-card-id="${card.id}">➕</button>
                    </div>
                `).join('');

                this.updateDeckStats();
                this.attachDeckBuilderEvents();
            }

            updateDeckStats() {
                // Utiliser getCurrentDeck() au lieu d'accéder directement à gameState.deck
                const deck = this.controller.getCurrentDeck();
                const deckCount = deck.length;
                const uniqueTypes = new Set(deck
                    .filter(card => card.types && card.types.length > 0)
                    .map(card => card.types[0].name)).size;

                document.getElementById('deckCardCount').textContent = deckCount;
                document.getElementById('deckTypeCount').textContent = uniqueTypes;
            }

            attachDeckBuilderEvents() {
                document.querySelectorAll('.add-to-deck-builder').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const cardId = e.target.dataset.cardId;
                        if (this.controller.addCardToDeck(cardId)) {
                            this.loadDeckBuilder();
                            this.view.showMessage('Carte ajoutée au deck!', 'success');
                        }
                    });
                });

                document.querySelectorAll('.remove-from-deck').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const cardId = e.target.dataset.cardId;
                        // Utiliser la méthode du contrôleur au lieu d'accéder directement au gameState
                        if (this.controller.removeCardFromDeck(cardId)) {
                            this.loadDeckBuilder();
                            this.view.showMessage('Carte retirée du deck', 'info');
                        }
                    });
                });

                document.getElementById('saveDeckBtn').addEventListener('click', () => {
                    this.gameState.save();
                    this.view.showMessage('Deck sauvegardé!', 'success');
                });

                document.getElementById('clearDeckBtn').addEventListener('click', () => {
                    if (confirm('Voulez-vous vraiment vider votre deck ?')) {
                        this.controller.clearDeck();
                        this.loadDeckBuilder();
                        this.view.showMessage('Deck vidé', 'info');
                    }
                });
            }

            showDetailedStats() {
                const stats = this.controller.getCollectionStats();
                this.view.showStats(stats);
            }

            closeModal() {
                document.getElementById('cardModal').style.display = 'none';
            }

            navigateToBattle() {
                window.location.href = 'battle.html';
            }

            addTestCards() {
                if (typeof window.addTestCardsToCollection === 'function') {
                    if (window.addTestCardsToCollection()) {
                        this.gameState.load();
                        this.refreshCollection();
                        this.updatePlayerInfo();
                        this.view.showMessage('🧪 Cartes de test ajoutées à votre collection!', 'success');
                    } else {
                        this.view.showMessage('❌ Erreur lors de l\'ajout des cartes de test', 'error');
                    }
                } else {
                    this.view.showMessage('❌ Script de test non disponible', 'error');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.collectionApp = new CollectionApp();
        });
    </script>
</body>

</html>
